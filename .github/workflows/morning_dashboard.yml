import json
import os
import tempfile

nb_path = 'morning_market_dashboard_email.ipynb'

with open(nb_path, 'r') as f:
    nb = json.load(f)

fred        = os.environ.get('FRED_API_KEY', '')
sender      = os.environ.get('EMAIL_SENDER', '')
password    = os.environ.get('EMAIL_PASSWORD', '')
to          = os.environ.get('EMAIL_TO', '')
output_dir  = tempfile.gettempdir()
pdf_file    = output_dir + '/morning_market_dashboard.pdf'

new_config = [
    "import os, tempfile\n",
    "FRED_API_KEY   = '" + fred     + "'\n",
    "EMAIL_SENDER   = '" + sender   + "'\n",
    "EMAIL_PASSWORD = '" + password + "'\n",
    "EMAIL_TO       = '" + to       + "'\n",
    "EMAIL_SUBJECT  = 'Morning Market Update'\n",
    "OUTPUT_DIR     = tempfile.gettempdir()\n",
    "PDF_FILE       = os.path.join(OUTPUT_DIR, 'morning_market_dashboard.pdf')\n",
]

for cell in nb['cells']:
    if cell.get('id') == 'config01':
        cell['source'] = new_config
        break

with open(nb_path, 'w') as f:
    json.dump(nb, f)

print("Secrets injected successfully.")
